name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly run against the newest database client SDKs (dependencies are not pinned), so
  # upstream breaking changes show up here before they reach users.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.8.6 check src tests
      - run: uvx ruff@0.8.6 format --check src tests

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: uv run --no-sync pytest tests/test_core.py tests/test_langchain.py tests/test_llamaindex.py -m "not integration"
      - run: uv run --no-sync python examples/quickstart.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --wait --wait-timeout 300 || docker compose up -d
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Wait for databases
        run: |
          for port in 6333 8080 19530 8000 5433 9200 9201 6379 27017 8200 4566 8443; do
            timeout 180 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2>/dev/null; do sleep 2; done"
          done
          sleep 20
      - run: uv run --no-sync pytest -m "integration" -v
      - if: failure()
        run: docker compose logs --tail 100

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
